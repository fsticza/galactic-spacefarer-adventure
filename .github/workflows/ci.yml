name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # @cds-models is generated from the CDS model and not checked in.
      - run: npm run generate-types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
